<div class="min-h-screen bg-slate-50 flex items-center justify-center font-nunito p-4 py-12">
  <div class="bg-white rounded-3xl shadow-xl w-full max-w-2xl overflow-hidden flex flex-col">
    <div class="p-8 text-center bg-orange-50 border-b border-orange-100">
      <h2 class="text-3xl font-extrabold text-orange-500 mb-2">Únete a PetHouse</h2>
      <p class="text-gray-500 font-bold">Crea tu cuenta de cliente y registra a tu mascota</p>
    </div>
    
    <div class="p-8">
      <form [formGroup]="registerForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-6">
        
        <!-- Datos Personales -->
        <div>
          <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Datos Personales</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Nombre</label>
              <input formControlName="nombre" type="text" placeholder="Ej. Mauricio" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Apellido</label>
              <input formControlName="apellido" type="text" placeholder="Ej. Heredia" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Edad</label>
              <input formControlName="edad" type="number" placeholder="Ej. 25" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Celular</label>
              <input formControlName="celular" type="text" placeholder="Ej. 3705022130" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-bold text-gray-700 mb-1">Dirección</label>
              <input formControlName="direccion" type="text" placeholder="Ej. Barrio Republica Argentina" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
          </div>
        </div>

        <!-- Datos de Cuenta -->
        <div>
          <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Datos de Cuenta</h3>
          <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Correo Electrónico</label>
              <input formControlName="email" type="email" placeholder="usuario@gmail.com" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Contraseña (Mín. 8)</label>
              <input formControlName="password" type="password" placeholder="••••••••" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
          </div>
        </div>

        <!-- Datos de Mascota -->
        <div>
          <h3 class="text-lg font-bold text-gray-800 mb-4 border-b pb-2">Datos de tu Mascota</h3>
          <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Tipo</label>
              <select formControlName="tipoMascota" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
                <option value="Perro">Perro</option>
                <option value="Gato">Gato</option>
              </select>
            </div>
            <div class="md:col-span-2">
              <label class="block text-sm font-bold text-gray-700 mb-1">Nombre de la Mascota</label>
              <input formControlName="nombreMascota" type="text" placeholder="Ej. Dandi" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
            <div>
              <label class="block text-sm font-bold text-gray-700 mb-1">Cant. Mascotas</label>
              <input formControlName="cantidadMascotas" type="number" value="1" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-orange-400 outline-none bg-gray-50">
            </div>
          </div>
        </div>

        <button type="submit" [disabled]="registerForm.invalid || isLoading" class="mt-6 w-full bg-orange-400 hover:bg-orange-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg transition-all disabled:opacity-50 flex items-center justify-center">
          <span *ngIf="isLoading">Creando cuenta...</span>
          <span *ngIf="!isLoading">Completar Registro</span>
        </button>
      </form>

      <div class="mt-8 text-center">
        <p class="text-gray-500 text-sm font-bold">
          ¿Ya tienes una cuenta? 
          <a routerLink="/login" class="text-orange-500 hover:text-orange-600 transition-colors">Ingresa aquí</a>
        </p>
      </div>
    </div>
  </div>
</div>
