<div class="h-full bg-slate-50 p-8 rounded-2xl border border-gray-100 flex flex-col font-nunito">
  
  <div class="flex justify-between items-center mb-8">
    <div>
      <a routerLink="/" class="text-sky-500 hover:text-sky-700 font-bold mb-2 flex items-center gap-1 text-sm">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        Volver a Inicio
      </a>
      <h1 class="text-3xl font-extrabold text-gray-800">Catálogo de Productos</h1>
      <p class="text-gray-500">Listado de productos públicos (Prueba de Endpoints)</p>
    </div>
    <button (click)="openModal()" class="bg-orange-400 hover:bg-orange-500 text-white px-6 py-2.5 rounded-full font-bold shadow-md transition-colors flex items-center gap-2">
      <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M10 3a1 1 0 011 1v5h5a1 1 0 110 2h-5v5a1 1 0 11-2 0v-5H4a1 1 0 110-2h5V4a1 1 0 011-1z" clip-rule="evenodd"/></svg>
      Nuevo Producto
    </button>
  </div>

  <!-- Tabla de Productos -->
  <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden flex-1">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-sky-50">
        <tr>
          <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider">Código</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider">Nombre</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider">Precio</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase tracking-wider">Stock</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-200">
        <tr *ngFor="let product of products" class="hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">{{ product.codigo }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ product.nombre }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">${{ product.precio }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
            <span class="px-3 py-1 inline-flex text-xs leading-5 font-semibold rounded-full" 
                  [ngClass]="product.stock > 0 ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'">
              {{ product.stock }} ud.
            </span>
          </td>
        </tr>
        <tr *ngIf="products.length === 0">
          <td colspan="4" class="px-6 py-8 text-center text-gray-500">No hay productos registrados.</td>
        </tr>
      </tbody>
    </table>
  </div>

  <!-- Modal -->
  <div *ngIf="isModalOpen" class="fixed inset-0 bg-gray-800 bg-opacity-50 flex items-center justify-center z-50 p-4">
    <div class="bg-white rounded-3xl shadow-xl w-full max-w-lg overflow-hidden">
      <div class="px-6 py-4 border-b border-gray-100 flex justify-between items-center bg-sky-50">
        <h3 class="text-xl font-bold text-gray-800">Crear Nuevo Producto</h3>
        <button (click)="closeModal()" class="text-gray-400 hover:text-gray-600 transition-colors">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>
      
      <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="p-6">
        <div class="grid grid-cols-2 gap-4 mb-4">
          <div class="col-span-2">
            <label class="block text-sm font-bold text-gray-700 mb-1">Nombre</label>
            <input formControlName="nombre" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition-all">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Código</label>
            <input formControlName="codigo" type="text" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition-all">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Precio</label>
            <input formControlName="precio" type="number" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition-all">
          </div>
          <div>
            <label class="block text-sm font-bold text-gray-700 mb-1">Stock</label>
            <input formControlName="stock" type="number" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition-all">
          </div>
          <div class="col-span-2">
            <label class="block text-sm font-bold text-gray-700 mb-1">Descripción</label>
            <textarea formControlName="descripcion" rows="3" class="w-full px-4 py-2 border border-gray-300 rounded-xl focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition-all"></textarea>
          </div>
        </div>
        
        <div class="mt-6 flex justify-end gap-3">
          <button type="button" (click)="closeModal()" class="px-6 py-2.5 rounded-full font-bold text-gray-600 hover:bg-gray-100 transition-colors">Cancelar</button>
          <button type="submit" [disabled]="productForm.invalid" class="bg-orange-400 hover:bg-orange-500 disabled:opacity-50 disabled:cursor-not-allowed text-white px-6 py-2.5 rounded-full font-bold shadow-md transition-colors">
            Guardar Producto
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
