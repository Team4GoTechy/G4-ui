<div class="h-full bg-slate-50 p-8 rounded-2xl border border-gray-100 flex flex-col font-nunito overflow-y-auto">
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-gray-800">Historial de Compras</h1>
    <p class="text-gray-500">Registro de tus compras anteriores en la tienda.</p>
  </div>

  <div class="bg-white rounded-3xl shadow-sm border border-gray-100 overflow-hidden">
    <table class="min-w-full divide-y divide-gray-200">
      <thead class="bg-sky-50">
        <tr>
          <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase">Fecha</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase">Productos</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase">Método Pago</th>
          <th class="px-6 py-4 text-left text-xs font-bold text-sky-700 uppercase">Estado</th>
        </tr>
      </thead>
      <tbody class="bg-white divide-y divide-gray-100">
        <tr *ngFor="let compra of compras" class="hover:bg-gray-50 transition-colors">
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-bold">{{ compra.fecha }}</td>
          <td class="px-6 py-4 text-sm font-bold text-gray-800">{{ compra.productos }}</td>
          <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">{{ compra.pago }}</td>
          <td class="px-6 py-4 whitespace-nowrap">
            <span class="px-3 py-1 inline-flex text-xs leading-5 font-bold rounded-full" [ngClass]="compra.color">
              {{ compra.estado }}
            </span>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
