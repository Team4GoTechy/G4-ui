<div class="h-full bg-slate-50 p-8 rounded-2xl border border-gray-100 flex flex-col font-nunito overflow-y-auto">
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-slate-800">Notificaciones</h1>
    <p class="text-slate-500 font-bold text-sm">Avisos y alertas importantes sobre la salud de tus mascotas y tus turnos.</p>
  </div>

  <!-- Spinner de Carga -->
  <div *ngIf="loading" class="flex justify-center items-center py-12 max-w-3xl">
    <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-sky-500"></div>
  </div>

  <!-- Estado Vacío -->
  <div *ngIf="!loading && notificaciones.length === 0" class="text-center py-12 max-w-3xl bg-white rounded-3xl border border-gray-100 shadow-sm">
    <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-slate-300 mx-auto mb-3" fill="none" viewBox="0 0 24 24" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9" />
    </svg>
    <p class="text-slate-550 font-extrabold">No tienes notificaciones</p>
    <p class="text-slate-400 text-sm mt-1">Aquí verás los ingresos a internación, altas médicas o nuevas recetas.</p>
  </div>

  <!-- Listado de Notificaciones -->
  <div *ngIf="!loading && notificaciones.length > 0" class="space-y-4 max-w-3xl">
    <div *ngFor="let notif of notificaciones" 
         (click)="marcarLeido(notif)"
         class="bg-white p-5 rounded-2xl shadow-sm border cursor-pointer transition-all flex items-start gap-4"
         [ngClass]="notif.leido ? 'border-gray-100 opacity-60 hover:opacity-80' : 'border-sky-200 border-l-4 border-l-sky-500 shadow-sm hover:shadow-md'">
      
      <!-- Icono según tipo -->
      <div class="p-3 rounded-full shrink-0"
           [ngClass]="notif.tipo === 'whatsapp' ? 'bg-emerald-100 text-emerald-600' : notif.tipo === 'email' ? 'bg-orange-100 text-orange-600' : 'bg-sky-100 text-sky-600'">
        <!-- SVG para WhatsApp / Alertas de Mensaje -->
        <svg *ngIf="notif.tipo === 'whatsapp'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 12h.01M12 12h.01M16 12h.01M21 12c0 4.418-4.03 8-9 8a9.863 9.863 0 01-4.255-.949L3 20l1.395-3.72C3.512 15.042 3 13.574 3 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/>
        </svg>
        <!-- SVG para Email -->
        <svg *ngIf="notif.tipo === 'email'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
        </svg>
        <!-- SVG para Sistema (internaciones, altas, recetas) -->
        <svg *ngIf="notif.tipo === 'sistema'" xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </div>

      <!-- Contenido de la notificación -->
      <div class="flex-1 min-w-0">
        <div class="flex justify-between items-center mb-1 flex-wrap gap-1">
          <h3 class="font-extrabold text-slate-800 text-base" [ngClass]="!notif.leido ? 'text-sky-700 font-black' : ''">
            {{ notif.titulo }}
          </h3>
          <span class="text-[10px] font-bold text-slate-400">
            {{ notif.fechaCreacion | date:'dd/MM/yyyy HH:mm\'hs\'' }}
          </span>
        </div>
        <p class="text-sm text-slate-650 font-medium leading-relaxed">{{ notif.mensaje }}</p>
      </div>
      
      <!-- Indicador visual de no leido -->
      <div *ngIf="!notif.leido" class="w-3 h-3 bg-sky-500 rounded-full mt-2 shrink-0 animate-pulse"></div>
    </div>
  </div>
</div>
