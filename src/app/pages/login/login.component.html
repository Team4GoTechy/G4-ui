<div class="min-h-screen bg-slate-50 flex items-center justify-center font-nunito p-4">
  <div class="bg-white rounded-3xl shadow-xl w-full max-w-md overflow-hidden flex flex-col">
    <div class="p-8 text-center bg-sky-50 border-b border-gray-100">
      <h2 class="text-3xl font-extrabold text-sky-500 mb-2">PetHouse</h2>
      <p class="text-gray-500 font-bold">Inicia sesión en tu cuenta</p>
    </div>
    
    <div class="p-8">
      <div *ngIf="errorMessage" class="mb-4 p-3 bg-red-100 text-red-600 rounded-xl text-center text-sm font-bold">
        {{ errorMessage }}
      </div>

      <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="flex flex-col gap-5">
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">Correo Electrónico</label>
          <input formControlName="email" type="email" placeholder="usuario@gmail.com" class="w-full px-5 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition-all bg-gray-50">
        </div>
        
        <div>
          <label class="block text-sm font-bold text-gray-700 mb-2">Contraseña</label>
          <input formControlName="password" type="password" placeholder="••••••••" class="w-full px-5 py-3 border border-gray-300 rounded-2xl focus:ring-2 focus:ring-sky-400 focus:border-sky-400 outline-none transition-all bg-gray-50">
        </div>

        <button type="submit" [disabled]="loginForm.invalid || isLoading" class="mt-4 w-full bg-orange-400 hover:bg-orange-500 text-white font-extrabold py-3.5 rounded-2xl shadow-lg transition-all disabled:opacity-50 flex items-center justify-center">
          <span *ngIf="isLoading">Cargando...</span>
          <span *ngIf="!isLoading">Ingresar</span>
        </button>
      </form>

      <div class="mt-8 text-center">
        <p class="text-gray-500 text-sm font-bold">
          ¿No tienes una cuenta? 
          <a routerLink="/register" class="text-sky-500 hover:text-sky-600 transition-colors">Regístrate aquí</a>
        </p>
        <p class="mt-4">
          <a routerLink="/" class="text-gray-400 hover:text-gray-600 text-xs font-bold transition-colors">Volver al Inicio</a>
        </p>
      </div>
    </div>
  </div>
</div>
