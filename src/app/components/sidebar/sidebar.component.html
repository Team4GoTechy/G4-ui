<div class="relative h-full py-4 pl-4 font-nunito transition-all duration-300 ease-in-out" 
     [ngClass]="isCollapsed ? 'w-24' : 'w-72'">
     
  <!-- Tarjeta Flotante -->
  <div class="bg-white h-full rounded-3xl shadow-xl flex flex-col overflow-hidden border border-gray-100 transition-all duration-300">
    
    <!-- Botón para esconder/mostrar -->
    <button (click)="toggleSidebar()" 
            class="absolute top-8 -right-3 bg-white border border-gray-200 text-gray-500 hover:text-sky-500 rounded-full p-1.5 shadow-md z-10 transition-colors">
      <svg *ngIf="!isCollapsed" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      <svg *ngIf="isCollapsed" xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
    </button>

    <!-- Perfil del Cliente -->
    <div class="p-6 border-b border-gray-50" *ngIf="user$ | async as user">
      <div class="flex items-center" [ngClass]="isCollapsed ? 'flex-col justify-center gap-2' : 'gap-4'">
        
        <!-- Foto de Perfil del Cliente -->
        <div class="rounded-full overflow-hidden shadow-md shrink-0 border-2 border-sky-100 flex items-center justify-center bg-gray-50"
             [ngClass]="isCollapsed ? 'w-10 h-10' : 'w-14 h-14'">
          <img [src]="getAvatarUrl(user.avatar)" alt="Foto de perfil" class="w-full h-full object-cover">
        </div>
        
        <!-- Datos (Se ocultan si colapsado) -->
        <div *ngIf="!isCollapsed" class="flex-1 overflow-hidden">
          <p class="text-base font-extrabold text-gray-800 truncate">{{ user.nombre }} {{ user.apellido }}</p>
          <p *ngIf="user.nombreMascota" class="text-xs text-gray-400 font-extrabold truncate flex items-center gap-1 mt-0.5">
            <span class="text-sky-500">🐾</span> {{ user.nombreMascota }}
          </p>
        </div>
      </div>
    </div>

    <!-- Menú -->
    <div class="p-4 flex-1">
      <ul class="space-y-2">
        <li *ngIf="!isCollapsed" class="text-xs text-gray-400 font-bold uppercase tracking-wider mb-2 px-2">Navegación</li>
        <li>
          <a routerLink="/cliente" routerLinkActive="bg-sky-50 text-sky-500 font-bold" [routerLinkActiveOptions]="{exact: true}" class="flex items-center px-4 py-3 text-gray-600 rounded-2xl hover:bg-gray-50 transition-colors" [title]="isCollapsed ? 'Inicio' : ''">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" [ngClass]="!isCollapsed ? 'mr-3' : 'mx-auto'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
            <span *ngIf="!isCollapsed">Inicio</span>
          </a>
        </li>
        <li>
          <a routerLink="/cliente/productos" routerLinkActive="bg-sky-50 text-sky-500 font-bold" class="flex items-center px-4 py-3 text-gray-600 rounded-2xl hover:bg-gray-50 transition-colors" [title]="isCollapsed ? 'Productos' : ''">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" [ngClass]="!isCollapsed ? 'mr-3' : 'mx-auto'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z"/></svg>
            <span *ngIf="!isCollapsed">Productos</span>
          </a>
        </li>
        <li>
          <a routerLink="/cliente/mascota" routerLinkActive="bg-sky-50 text-sky-500 font-bold" class="flex items-center px-4 py-3 text-gray-600 rounded-2xl hover:bg-gray-50 transition-colors" [title]="isCollapsed ? 'Mi Mascota' : ''">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" [ngClass]="!isCollapsed ? 'mr-3' : 'mx-auto'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
            <span *ngIf="!isCollapsed">Mi Mascota</span>
          </a>
        </li>
        <li>
          <a routerLink="/cliente/turnos" routerLinkActive="bg-sky-50 text-sky-500 font-bold" class="flex items-center px-4 py-3 text-gray-600 rounded-2xl hover:bg-gray-50 transition-colors" [title]="isCollapsed ? 'Turnos' : ''">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" [ngClass]="!isCollapsed ? 'mr-3' : 'mx-auto'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
            <span *ngIf="!isCollapsed">Turnos</span>
          </a>
        </li>
        <li>
          <a routerLink="/cliente/historial" routerLinkActive="bg-sky-50 text-sky-500 font-bold" class="flex items-center px-4 py-3 text-gray-600 rounded-2xl hover:bg-gray-50 transition-colors" [title]="isCollapsed ? 'Historial de Compras' : ''">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" [ngClass]="!isCollapsed ? 'mr-3' : 'mx-auto'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
            <span *ngIf="!isCollapsed">Historial de Compras</span>
          </a>
        </li>
        <li class="relative">
          <a routerLink="/cliente/notificaciones" routerLinkActive="bg-sky-50 text-sky-500 font-bold" class="flex items-center px-4 py-3 text-gray-600 rounded-2xl hover:bg-gray-50 transition-colors" [title]="isCollapsed ? 'Notificaciones' : ''">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" [ngClass]="!isCollapsed ? 'mr-3' : 'mx-auto'" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
            <span *ngIf="!isCollapsed">Notificaciones</span>
            <!-- Burbuja con el sidebar expandido -->
            <span *ngIf="!isCollapsed && unreadCount > 0" class="ml-auto bg-rose-500 text-white font-extrabold text-[10px] px-2 py-0.5 rounded-full shadow-sm">
              {{ unreadCount }}
            </span>
          </a>
          <!-- Burbuja con el sidebar colapsado -->
          <span *ngIf="isCollapsed && unreadCount > 0" class="absolute top-1 right-5 w-5 h-5 bg-rose-500 text-white font-black text-[9px] flex items-center justify-center rounded-full border-2 border-white pointer-events-none">
            {{ unreadCount }}
          </span>
        </li>
      </ul>
    </div>

    <!-- Cerrar Sesión -->
    <div class="p-4 border-t border-gray-50">
      <button (click)="logout()" class="w-full flex items-center px-4 py-3 text-red-500 font-bold rounded-2xl hover:bg-red-50 transition-colors" [ngClass]="isCollapsed ? 'justify-center' : 'justify-start'" [title]="isCollapsed ? 'Salir' : ''">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 shrink-0" [ngClass]="!isCollapsed ? 'mr-3' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
        <span *ngIf="!isCollapsed">Salir</span>
      </button>
    </div>

  </div>
</div>
