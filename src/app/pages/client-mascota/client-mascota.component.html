<div class="h-full bg-slate-50 p-8 rounded-2xl border border-gray-100 flex flex-col font-nunito overflow-y-auto" *ngIf="user$ | async as user">
  
  <div class="mb-8">
    <h1 class="text-3xl font-extrabold text-gray-800">Expediente de {{ user.nombreMascota }} {{ user.tipoMascota === 'Perro' ? '🐶' : '🐱' }}</h1>
    <p class="text-gray-500">Monitoreo de salud y signos vitales</p>
  </div>

  <!-- Signos Vitales -->
  <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-sky-100 flex items-center gap-4">
      <div class="bg-sky-100 text-sky-500 p-3 rounded-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 6l3 1m0 0l-3 9a5.002 5.002 0 006.001 0M6 7l3 9M6 7l6-2m6 2l3-1m-3 1l-3 9a5.002 5.002 0 006.001 0M18 7l3 9m-3-9l-6-2m0-2v2m0 16V5m0 16H9m3 0h3"/></svg>
      </div>
      <div>
        <p class="text-sm font-bold text-gray-400 uppercase tracking-wide">Peso Actual</p>
        <p class="text-2xl font-extrabold text-gray-800">4.5 <span class="text-lg text-gray-500">kg</span></p>
      </div>
    </div>
    
    <div class="bg-white p-6 rounded-2xl shadow-sm border border-orange-100 flex items-center gap-4">
      <div class="bg-orange-100 text-orange-500 p-3 rounded-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4.318 6.318a4.5 4.5 0 000 6.364L12 20.364l7.682-7.682a4.5 4.5 0 00-6.364-6.364L12 7.636l-1.318-1.318a4.5 4.5 0 00-6.364 0z"/></svg>
      </div>
      <div>
        <p class="text-sm font-bold text-gray-400 uppercase tracking-wide">Frec. Cardíaca</p>
        <p class="text-2xl font-extrabold text-gray-800">120 <span class="text-lg text-gray-500">bpm</span></p>
      </div>
    </div>

    <div class="bg-white p-6 rounded-2xl shadow-sm border border-emerald-100 flex items-center gap-4">
      <div class="bg-emerald-100 text-emerald-500 p-3 rounded-xl">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
      </div>
      <div>
        <p class="text-sm font-bold text-gray-400 uppercase tracking-wide">Próxima Vacuna</p>
        <p class="text-2xl font-extrabold text-gray-800">Antirrábica</p>
      </div>
    </div>
  </div>

  <!-- Calendario GitHub Style -->
  <div class="bg-white p-8 rounded-3xl shadow-sm border border-gray-100">
    <h3 class="text-xl font-bold text-gray-800 mb-2">Estado de Salud (Últimos 120 días)</h3>
    <p class="text-sm text-gray-500 mb-6 flex gap-4">
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-emerald-400"></span> Excelente</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-yellow-400"></span> Regular</span>
      <span class="flex items-center gap-1"><span class="w-3 h-3 rounded bg-red-500"></span> Malestar</span>
    </p>

    <div class="flex flex-wrap gap-1.5">
      <div *ngFor="let day of healthCalendar" 
           [class]="getColor(day) + ' w-4 h-4 rounded-sm transition-transform hover:scale-125 cursor-pointer'"
           [title]="day === 0 ? 'Sano' : day === 1 ? 'Regular' : 'Malestar'">
      </div>
    </div>
  </div>

</div>
